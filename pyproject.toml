[project]
name = "design-token-sync"
version = "0.1.0"
description = "Design token synchronization tool for FlexInfer visual libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "FlexInfer Team", email = "dev@flexinfer.ai" }
]

dependencies = []

[project.scripts]
design-token-sync = "sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
