[project]
name = "design-token-sync"
version = "0.1.0"
description = "Design token synchronization tool for FlexInfer visual libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "FlexInfer Team", email = "dev@flexinfer.ai" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
design-token-sync = "sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
