include:
  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

stages:
  - lint
  - test
  - build
  - publish

# Flat layout (sync.py + tests/, no src/): lint targets are overridden below.
lint:
  extends: .python-lint
  script:
    - ruff check sync.py tests

test:
  extends: .python-test

build:
  extends: .python-base
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  image: docker.io/library/python:3.12
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  script:
    - echo "Manual publish step on tags."

radar-scan:
  extends: .radar-scan
