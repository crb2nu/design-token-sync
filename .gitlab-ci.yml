stages:
  - lint
  - test
  - build
  - publish

default:
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check sync.py tests

test:
  stage: test
  script:
    - pytest -v --maxfail=1

build:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  script:
    - echo "Manual publish step on tags."
